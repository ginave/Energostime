name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install briefcase toga-android

    - name: Prepare Project Structure
      run: |
        mkdir -p energytracker/src/energytracker
        cp main.py energytracker/src/energytracker/app.py
        
        cat << 'EOF' > energytracker/pyproject.toml
        [build-system]
        requires = ["briefcase"]

        [tool.briefcase]
        project_name = "Energy Tracker"
        bundle = "com.example"
        version = "0.0.1"
        url = "https://example.com/energytracker"
        license = "BSD-3-Clause"
        author = "Developer"
        author_email = "developer@example.com"

        [tool.briefcase.app.energytracker]
        formal_name = "Energy Tracker"
        description = "Energy Tracker App"
        icon = "src/energytracker/resources/energytracker"
        sources = ["src/energytracker"]
        requires = []

        [tool.briefcase.app.energytracker.android]
        build_style = "app"
        EOF

    - name: Build Android APK
      run: |
        cd energytracker
        briefcase create android
        briefcase build android

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: EnergyTracker-APK
        path: energytracker/build/energytracker/android/gradle/app/build/outputs/apk/debug/*.apk
        
