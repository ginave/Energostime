name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install briefcase

    - name: Create Briefcase Project & Build APK
      run: |
        briefcase new --no-input \
          formal_name="Energy Tracker" \
          app_name="energytracker" \
          bundle="com.example" \
          description="Energy Tracker App" \
          author="Developer"
        
        cp main.py energytracker/src/energytracker/app.py
        
        cd energytracker
        briefcase create android
        briefcase build android

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: EnergyTracker-APK
        path: energytracker/build/energytracker/android/gradle/app/build/outputs/apk/debug/*.apk
        
